<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SHAMS</title>
<link rel="icon" href="/favicon.ico">
<style>
:root {
  color-scheme: light dark;
  --canvas: #fff;
  --sidebar: #f7f7f8;
  --ink: #202124;
  --muted: #62646c;
  --line: #e6e6e9;
  --hover: #ececef;
  --bubble: #f2f2f4;
  --code: #f8f8f9;
  --accent: #6850aa;
  --danger: #a93245;
  --send: #222227;
  --send-ink: #fff;
  font: 15px/1.5 system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #212121; --sidebar: #181818; --ink: #f2f2f2; --muted: #b4b4bc;
    --line: #3b3b40; --hover: #2d2d32; --bubble: #303033; --code: #27272a;
    --accent: #c4aff7; --danger: #ffa0ae; --send: #eee; --send-ink: #181818;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--ink); background: var(--canvas); }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex: none; vertical-align: middle; }
a { color: var(--accent); }
.shell { display: grid; grid-template-columns: 254px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.shell.closed { grid-template-columns: minmax(0, 1fr); }
.shell.closed .sidebar { display: none; }
.sidebar { min-height: 0; display: flex; flex-direction: column; padding: 14px 12px; background: var(--sidebar); border-right: 1px solid var(--line); }
.brand, .topbar { display: flex; align-items: center; gap: 10px; }
.brand { padding: 4px 5px 18px; }
.brand img { width: 32px; height: 32px; border-radius: 9px; }
.brand strong { font-size: 17px; letter-spacing: .01em; }
.icon, .new-chat, .thread, .suggestion, .copy { border: 0; background: transparent; border-radius: 9px; }
.icon { display: grid; place-items: center; padding: 8px; }
.icon:hover, .thread:hover, .thread[aria-current="true"], .copy:hover { background: var(--hover); }
#close-sidebar { margin-left: auto; }
.new-chat { display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px; font-weight: 600; border: 1px solid var(--line); background: var(--canvas); }
.new-chat:hover, .suggestion:hover { background: var(--hover); }
.history-title { padding: 0 9px; margin: 26px 0 7px; color: var(--muted); font-size: 12px; font-weight: 650; }
.history { flex: 1; overflow-y: auto; min-height: 0; }
.thread-row { display: flex; align-items: center; gap: 3px; margin-block: 2px; }
.thread { flex: 1; min-width: 0; text-align: left; font-size: 14px; padding: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.delete-thread { width: 38px; height: 38px; flex: none; color: var(--muted); }
.delete-thread:is(:hover, :focus-visible) { color: var(--danger); }
.delete-dialog { width: min(420px, calc(100% - 28px)); padding: 22px; border: 1px solid var(--line); border-radius: 15px; background: var(--canvas); color: var(--ink); }
.delete-dialog::backdrop { background: #0007; }
.delete-dialog h2 { font-size: 18px; margin: 0 0 8px; }
.delete-dialog p { margin: 0 0 18px; color: var(--muted); overflow-wrap: anywhere; }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.dialog-actions button { border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; background: var(--canvas); }
.dialog-actions .confirm-delete { color: var(--canvas); background: var(--danger); border-color: var(--danger); font-weight: 600; }
.history-empty { padding: 8px 9px; font-size: 13px; color: var(--muted); }
.sidebar-footer { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 13px 7px 0; color: var(--muted); font-size: 12px; }
.dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }
main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.topbar { min-height: 62px; padding: 8px 20px; flex-shrink: 0; }
.shell:not(.closed) #open-sidebar { display: none; }
.model { max-width: min(300px, 70vw); min-width: 0; text-overflow: ellipsis; border: 1px solid var(--line); background: var(--canvas); border-radius: 9px; padding: 7px 9px; }
.top-label { margin-left: auto; color: var(--muted); font-size: 12px; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.empty { width: min(100% - 32px, 660px); margin: auto; text-align: center; padding: 14px 0 22px; }
.empty img { width: 54px; height: 54px; border-radius: 15px; }
.empty h1 { font-size: clamp(24px, 5vw, 34px); line-height: 1.2; letter-spacing: -.035em; margin: 13px 0 8px; }
.empty p { color: var(--muted); margin: 0; }
.conversation { width: min(100% - 36px, 760px); margin: auto; padding: 18px 0 26px; }
.user-message { width: fit-content; max-width: 85%; margin: 0 0 20px auto; background: var(--bubble); border-radius: 22px; padding: 11px 17px; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { min-width: 0; margin: 0 0 30px; overflow-wrap: anywhere; }
.reply-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; margin-bottom: 10px; }
.reply-label img { width: 24px; height: 24px; border-radius: 7px; }
.reply-status { color: var(--muted); }
.sources { margin-top: 14px; font-size: .9em; color: var(--muted); }
.sources summary { cursor: pointer; }
.reply-live > :is(p, h1, h2, h3, h4, blockquote):last-child::after { content: ""; display: inline-block; width: .4em; height: .8em; margin-inline-start: .25em; border-radius: 2px; background: var(--accent); }
.error { color: var(--danger); }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 12px; color: var(--muted); }
.md code { background: var(--code); border-radius: 4px; padding: 2px 4px; }
.codebox { min-width: 0; margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--code); }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.copy { padding: 5px 7px; font-size: 12px; }
pre { overflow: auto; margin: 0; padding: 13px; }
pre code { padding: 0; }
.table-wrap { overflow: auto; }
table { border-collapse: collapse; }
th, td { padding: 5px 10px; border: 1px solid var(--line); }
.composer-area { width: min(100% - 36px, 760px); margin: 0 auto; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
.composer { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line); border-radius: 26px; padding: 8px 9px 8px 16px; background: var(--canvas); box-shadow: 0 3px 16px #0000000b; }
.composer:focus-within { border-color: var(--muted); }
textarea { resize: none; display: block; width: 100%; min-height: 37px; max-height: 150px; border: 0; background: transparent; padding: 7px 0 5px; outline: none; }
textarea:focus-visible { outline: none; }
textarea::placeholder { color: var(--muted); }
.send { display: grid; place-items: center; flex: none; width: 37px; height: 37px; border: 0; border-radius: 50%; background: var(--send); color: var(--send-ink); }
.send:disabled { opacity: .33; }
.suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
.suggestion { padding: 7px 12px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.note { text-align: center; margin: 9px 0 0; font-size: 12px; color: var(--muted); }
#status { margin: 0 6px 6px; font-size: 13px; }
#status:empty { display: none; }
#scrim { display: none; }
main.welcome .scroll { display: none; }
main.welcome { justify-content: center; }
main.welcome .topbar { position: absolute; inset: 0 0 auto 254px; }
.closed main.welcome .topbar { left: 0; }
main.welcome .empty { margin: 0 auto; }
@media (max-width: 700px) {
  .shell, .shell.closed { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(280px, 85vw); z-index: 3; }
  .shell:not(.closed) #scrim { display: block; position: fixed; inset: 0; z-index: 2; background: #0006; border: 0; }
  .topbar { padding-inline: 10px; }
  .top-label { display: none; }
  main.welcome .topbar { left: 0; }
  .conversation, .composer-area { width: calc(100% - 24px); }
  .user-message { max-width: 90%; }
  .delete-thread { width: 44px; height: 44px; }
}
</style>
</head>
<body>
<div class="shell closed" id="shell">
  <button id="scrim" type="button" aria-label="Đóng thanh bên"></button>
  <aside class="sidebar" id="sidebar" aria-label="Lịch sử chat">
    <div class="brand">
      <img src="/static/logo.png" alt=""><strong>SHAMS</strong>
      <button class="icon" id="close-sidebar" type="button" aria-label="Đóng thanh bên" title="Đóng thanh bên"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    </div>
    <button class="new-chat" id="new-chat" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Cuộc trò chuyện mới</button>
    <h2 class="history-title">Cuộc trò chuyện</h2>
    <nav class="history" id="history" aria-label="Cuộc trò chuyện đã lưu"></nav>
    <div class="sidebar-footer"><span class="dot"></span>Lịch sử lưu trên trình duyệt này</div>
  </aside>
  <main class="welcome" id="main">
    <header class="topbar">
      <button class="icon" id="open-sidebar" type="button" aria-controls="sidebar" aria-label="Mở thanh bên" title="Mở thanh bên"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <select class="model" id="model" aria-label="Model chat" disabled><option>Đang tìm model…</option></select>
      <span class="top-label">SHAMS Chat</span>
    </header>
    <section class="scroll" id="scroll" tabindex="0" aria-label="Nội dung cuộc trò chuyện">
      <div class="conversation" id="conversation" role="log"></div>
    </section>
    <section class="empty" id="welcome">
      <img src="/static/logo.png" alt="">
      <h1>Hôm nay bạn muốn hỏi gì?</h1>
      <p>Trò chuyện với các model đã cấu hình trong SHAMS.</p>
    </section>
    <div class="composer-area">
      <div id="status" role="status"></div>
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" maxlength="100000" placeholder="Nhắn cho SHAMS…" aria-label="Tin nhắn"></textarea>
        <button class="send" id="send" type="submit" aria-label="Gửi tin nhắn" title="Gửi tin nhắn" disabled><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
      <div class="suggestions" id="suggestions">
        <button class="suggestion" type="button">Giải thích một khái niệm</button>
        <button class="suggestion" type="button">Lên ý tưởng cho dự án</button>
        <button class="suggestion" type="button">Giúp tôi viết rõ hơn</button>
      </div>
      <p class="note">SHAMS có thể mắc lỗi. Hãy kiểm tra lại thông tin quan trọng.</p>
    </div>
  </main>
</div>
<dialog class="delete-dialog" id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
  <h2 id="delete-title">Xóa cuộc trò chuyện?</h2>
  <p id="delete-description">Cuộc trò chuyện sẽ bị xóa khỏi lịch sử trên trình duyệt này.</p>
  <form method="dialog" class="dialog-actions">
    <button type="submit" value="cancel" autofocus>Hủy</button>
    <button type="submit" class="confirm-delete" value="delete">Xóa cuộc trò chuyện</button>
  </form>
</dialog>
<script src="/static/chat.js?v=4" defer></script>
</body>
</html>
