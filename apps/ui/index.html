<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAMS</title>
<link rel="icon" href="/static/favicon.png" type="image/png">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --border:#e4e6eb; --text:#16181d; --muted:#6b7280; --faint:#9aa1ad;
  --accent:#2f6fde; --accent-soft:#e8f0fd; --ok:#1e8e4e; --ok-soft:#e3f5ea; --warn:#b26a00; --warn-soft:#fdf1dc;
  --bad:#c4352b; --bad-soft:#fbe7e5; --chip:#eef0f3; --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a20; --border:#272b33; --text:#e7e9ee; --muted:#9aa1ad; --faint:#6b7280;
    --accent:#6b9cf5; --accent-soft:#1c2a44; --ok:#4cc584; --ok-soft:#163324; --warn:#e3a94a; --warn-soft:#3a2c12;
    --bad:#f07a70; --bad-soft:#3d1c1a; --chip:#232730;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --border:#272b33; --text:#e7e9ee; --muted:#9aa1ad; --faint:#6b7280;
  --accent:#6b9cf5; --accent-soft:#1c2a44; --ok:#4cc584; --ok-soft:#163324; --warn:#e3a94a; --warn-soft:#3a2c12;
  --bad:#f07a70; --bad-soft:#3d1c1a; --chip:#232730;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1280px;margin:16px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;
  display:grid;grid-template-rows:auto 1fr auto;min-height:calc(100vh - 32px);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:17px;letter-spacing:.08em;font-weight:700}
.brand .full{color:var(--muted);font-size:12px;letter-spacing:0}
.crumb{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
.crumb b{font-weight:600}.crumb span{color:var(--faint);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-chip{background:var(--chip);color:var(--text);font-weight:500}
.b-accent{background:var(--accent-soft);color:var(--accent)}
.hright{display:flex;align-items:center;gap:10px}
.iconbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px}
.iconbtn:hover{background:var(--chip);color:var(--text)}
.main{display:grid;grid-template-columns:180px 1fr 230px;min-height:0}
nav{border-right:1px solid var(--border);padding:16px 8px}
.sect{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:0 10px 8px}
nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--text);
  padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;text-align:left}
nav button:hover{background:var(--chip)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .count{margin-left:auto;font-size:11px;color:var(--muted)}
.center{padding:20px 24px;min-width:0;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:calc(100vh - 220px)}
.ctitle{display:flex;align-items:center;justify-content:space-between}
.ctitle h2{margin:0;font-size:17px}
.msg{padding:2px 0}
.msg .who{font-weight:600;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.msg.user .body{font-size:15px}
.msg .body{white-space:pre-wrap}
.items{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.items li{display:flex;align-items:center;gap:8px;font-size:13px}
.dot{width:14px;height:14px;flex:none;display:inline-block}
.composer{margin-top:auto;display:flex;align-items:center;border:1px solid var(--border);border-radius:12px;padding:10px 10px 10px 14px;gap:8px;background:var(--panel)}
.composer input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit}
.composer button{border:0;background:var(--text);color:var(--panel);width:28px;height:28px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.composer button:disabled{opacity:.4;cursor:default}
aside{border-left:1px solid var(--border);padding:16px}
aside .blk{padding:0 0 14px;margin:0 0 14px;border-bottom:1px solid var(--border)}
aside .blk:last-child{border-bottom:0}
.lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.big{font-size:22px;font-weight:700}
.val{font-weight:600}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
footer{border-top:1px solid var(--border);padding:12px 20px}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fhead b{font-size:13px}
.console{font-family:var(--mono);font-size:11.5px;color:var(--muted);max-height:96px;overflow:auto;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
td code{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}.small{font-size:12px}
.lanes{display:grid;gap:10px}
.card{border:1px solid var(--border);border-radius:10px;padding:12px}
.card h3{margin:0 0 6px;font-size:14px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.actions button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
.actions button:hover{background:var(--chip)}
.actions .btn.primary,.actions .btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.actions .btn.primary:hover{opacity:.9}
.actions .btn.primary:disabled{opacity:.45;cursor:default}
.dag{display:grid;gap:12px}
.col{display:flex;gap:8px;flex-wrap:wrap}
.node{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.engines{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 18px}
.eng{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;font:inherit;min-width:120px}
.eng b{display:block;font-size:13px}.eng span{font-size:11px;color:var(--muted)}
.eng[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
@media (max-width:900px){
  .app{margin:0;border-radius:0;border-left:0;border-right:0}
  .main{grid-template-columns:1fr}
  header{flex-wrap:wrap;gap:8px;padding:12px 16px} .brand .full{display:none}
  .crumb span{display:none}
  nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}
  nav .sect{display:none} nav button{width:auto;white-space:nowrap}
  aside{border-left:0;border-top:1px solid var(--border)}
  .center{max-height:none;padding:16px}
}
.nav-proj{font-size:12.5px}
nav .grow{flex:1}
nav .bottom{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
.newproj{color:var(--accent)!important}
.offline{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:grid;place-items:center;z-index:9}
.offline[hidden]{display:none}
.offline .card{background:var(--panel);max-width:460px;text-align:center;padding:24px}
.offline code{font-family:var(--mono);background:var(--chip);padding:2px 6px;border-radius:6px}
/* settings */
.stabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:8px}
.stabs button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.stabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.scope{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.scope select{font:inherit;font-size:12px}
.group{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .t b{display:block;font-size:13.5px}.row .t span{font-size:12px;color:var(--muted)}
.row .c{flex:none;display:flex;gap:6px;align-items:center}
.gtitle{font-weight:600;font-size:13px;margin:6px 0 2px}
input.f,select.f,textarea.f{font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
textarea.f{width:100%;font-family:var(--mono);font-size:12px;min-height:90px}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--chip);border-radius:99px;transition:.2s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px #0003}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i:before{transform:translateX(18px)}
.choice{display:grid;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice label.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice b{display:block;font-size:13px}.choice span{font-size:12px;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;align-items:end}
.formgrid label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.msgbar{font-size:12px;padding:6px 10px;border-radius:8px}
.toolrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--border)}
.toolrow:last-child{border-bottom:0}
.gpu-meter{margin-top:6px}
.center>*{flex-shrink:0}
.formgrid input.f,.formgrid select.f{width:100%;min-width:0}
.big.sm{font-size:15px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">
        <img src="/static/logo.png" alt="SHAMS" width="28" height="28" style="border-radius:7px">
        <h1>SHAMS</h1><span class="full">Sequential Heterogeneous AI Manufacturing System</span>
        <span class="badge b-chip" id="ver"></span>
      </div>
      <div class="crumb">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <b id="pname">—</b><span id="ppath"></span>
      </div>
    </div>
    <div class="hright">
      <span id="wmode" class="badge b-ok">—</span>
      <button class="iconbtn" id="theme" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="main">
    <nav id="nav"></nav>
    <section class="center" id="center"></section>
    <aside>
      <div class="sect" style="padding:0 0 10px">TRẠNG THÁI</div>
      <div class="blk">
        <div class="lbl">Tiến độ</div>
        <div class="big" id="prog">0/0</div>
        <div class="bar"><i id="progbar" style="width:0"></i></div>
      </div>
      <div class="blk">
        <div class="lbl">Worker đang chạy</div>
        <div class="val" id="active">—</div>
        <div style="margin-top:6px" id="gpu"></div>
      </div>
      <div class="blk">
        <div class="lbl" id="vramlbl">VRAM</div>
        <div class="big" id="vram">—</div>
        <div class="bar gpu-meter"><i id="vrambar" style="width:0"></i></div>
        <div class="small muted" id="gpuname" style="margin-top:6px"></div>
        <div class="lbl" style="margin-top:10px">RAM</div>
        <div class="val" id="ram">—</div>
      </div>
      <div class="blk">
        <div class="lbl">Worker kế tiếp</div>
        <div class="val" id="next">—</div>
      </div>
      <div class="blk" id="reviewblk" hidden>
        <div class="lbl">Chờ bạn duyệt</div>
        <div id="reviewlist"></div>
      </div>
    </aside>
  </div>

  <footer>
    <div class="fhead"><b>Console</b><span id="conn" class="badge b-ok">Connected</span></div>
    <div class="console" id="console"></div>
  </footer>
</div>
<div class="offline" id="offline" hidden>
  <div class="card">
    <h3>Không kết nối được SHAMS</h3>
    <p class="small muted">Giao diện cần SHAMS server đang chạy trên máy này. Mở terminal và chạy:</p>
    <p><code>shams ui</code></p>
    <p class="small muted">Trang sẽ tự kết nối lại.</p>
  </div>
</div>

<script>
const VIEWS = [
  ["chat","Chat",'<circle cx="12" cy="12" r="8"/>'],
  ["workflow","Workflow",'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H14a3 3 0 0 1 3 3v6.5"/>'],
  ["workers","AI Workers",'<rect x="4" y="7" width="16" height="11" rx="3"/><path d="M9 12h.01M15 12h.01M12 3v4"/>'],
  ["models","Models",'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>'],
  ["artifacts","Artifacts",'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'],
  ["qa","QA Results",'<path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'],
];
const GEAR = '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gb = mb => (mb/1024).toFixed(mb >= 10240 ? 0 : 1) + " GB";
let view = "chat", S = null, sending = false, SET = null, stab = "general", scope = "user", flash = null, mcpRows = null, testResults = {};
try { view = localStorage.getItem("shams.view") || "chat"; stab = localStorage.getItem("shams.stab") || "general"; } catch (e) {}
try { const t = localStorage.getItem("shams.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem("shams.theme", nxt); } catch (e) {}
};

function go(v){ view = v; try{localStorage.setItem("shams.view", v)}catch(e){}; if (v === "settings") loadSettings(); else if (v === "direct") loadDirect(); else render(true); }

function navRender(){
  const nav = $("nav");
  const btn = (id, label, icon, count, cls="") => `<button data-v="${id}" class="${id===view?"on":""} ${cls}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icon}</svg>${label}${count!==undefined&&count!==""?`<span class="count">${count}</span>`:""}</button>`;
  let h = `<div class="sect">DỰ ÁN</div>`;
  for (const v of VIEWS){
    const c = v[0]==="workflow" ? S.tasks.length : v[0]==="artifacts" ? S.artifacts.length : v[0]==="qa" ? S.qc.length : "";
    h += btn(v[0], v[1], v[2], c);
  }
  h += `<div class="sect" style="margin-top:14px">CHẠY TRỰC TIẾP</div>` + btn("direct","Direct Mode",'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>');
  h += `<div class="sect" style="margin-top:14px">WORKSPACE</div>`;
  for (const p of S.projects.slice(0, 12)){
    const on = p.id === S.project.id;
    h += `<button class="nav-proj ${on?"on":""}" data-p="${esc(p.id)}" title="${esc(p.goal||p.folder)}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>${esc((p.goal||p.folder).slice(0,22))}</button>`;
  }
  h += `<button class="newproj" data-new="1"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Dự án mới</button>`;
  h += `<div class="bottom">${btn("settings","Settings",GEAR)}</div>`;
  nav.innerHTML = h;
  nav.querySelectorAll("[data-v]").forEach(b => b.onclick = () => go(b.dataset.v));
  nav.querySelectorAll("[data-p]").forEach(b => b.onclick = () => openProject(b.dataset.p));
  nav.querySelector("[data-new]").onclick = newProject;
}
function stateIcon(state){
  if (state === "ACCEPTED") return '<svg class="dot" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
  if (["RUNNING","LEASED","QC_PENDING"].includes(state)) return '<svg class="dot spin" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4"><path d="M12 3a9 9 0 1 1-9 9"/></svg>';
  if (["REPAIR_REQUIRED","STALE"].includes(state)) return '<svg class="dot" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';
  if (["HUMAN_REVIEW","BLOCKED","FAILED"].includes(state)) return '<svg class="dot" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
  return '<svg class="dot" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/></svg>';
}
function badgeFor(state){
  const cls = state==="ACCEPTED"?"b-ok":["HUMAN_REVIEW","BLOCKED","FAILED"].includes(state)?"b-bad":
    ["REPAIR_REQUIRED","STALE"].includes(state)?"b-warn":["RUNNING","LEASED","QC_PENDING"].includes(state)?"b-accent":"b-chip";
  return `<span class="badge ${cls}">${esc(state)}</span>`;
}

function chatView(){
  const modeLbl = {autonomous:"Autonomous",guided:"Guided",collaborative:"Collaborative"}[S.mode] || S.mode;
  let h = `<div class="ctitle"><h2>Chat</h2><span class="badge b-chip">${esc(modeLbl)}</span></div>`;
  if (!S.chat.length){
    h += `<div class="empty">Mô tả dự án bạn muốn SHAMS sản xuất. SHAMS lập Task DAG, giao từng việc cho model AI phù hợp, kiểm thử độc lập và sửa lỗi theo vòng lặp.<br><span class="small">Ví dụ: "CLI Python quản lý ghi chú", "API backend bằng TypeScript" hoặc "Game giải đố 3D bằng Godot".</span></div>`;
    h += `<div class="small muted" style="text-align:center;margin-bottom:6px">Lĩnh vực (Domain Pack, SHAMS tự nhận ra từ yêu cầu)</div><div class="engines">` +
      (S.packs||[]).map(p => `<button type="button" class="eng" data-domain="${esc(p.id)}" aria-pressed="${p.id===S.project.domain}"><b>${esc(p.display)}</b><span>${esc(p.description||"")}</span></button>`).join("") + `</div>`;
    const pk = (S.packs||[]).find(p => p.id===S.project.domain);
    for (const [opt, choices] of Object.entries(pk ? pk.options||{} : {})){
      h += `<div class="small muted" style="text-align:center;margin-bottom:6px">${esc(opt)}</div><div class="engines">` +
        choices.map(c => `<button type="button" class="eng" data-opt="${esc(opt)}" data-val="${esc(c.id)}" aria-pressed="${c.id===(S.project.selected||{})[opt]}"><b>${esc(c.display)}</b><span>${esc(c.language||"")}</span></button>`).join("") + `</div>`;
    }
  }
  const order = {RUNNING:0,LEASED:0,QC_PENDING:0,REPAIR_REQUIRED:1,HUMAN_REVIEW:1,BLOCKED:1,ACCEPTED:2,STALE:1,READY:3,PENDING:4};
  for (const m of S.chat){
    if (m.role === "user"){
      h += `<div class="msg user"><div class="who">You</div><div class="body">${esc(m.text)}</div></div>`;
    } else {
      h += `<div class="msg"><div class="who"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><rect x="4" y="7" width="16" height="11" rx="3"/><path d="M9 12h.01M15 12h.01"/></svg>SHAMS</div><div class="body">${esc(m.text)}</div>`;
      if (m.live && S.tasks.length){
        const active = S.tasks.filter(t => !["PENDING","READY"].includes(t.state))
          .sort((a,b) => (order[a.state]??5)-(order[b.state]??5)).slice(0,8);
        h += `<ul class="items">` + active.map(t => `<li>${stateIcon(t.state)}${esc(t.title)} — <b>${esc(t.label)}</b>${t.attempt?` <span class="muted small">(lần ${t.attempt+1})</span>`:""}</li>`).join("") + `</ul>`;
        const rest = S.tasks.length - active.length;
        const waiting = S.tasks.filter(t => ["PENDING","READY"].includes(t.state)).length;
        if (rest > 0) h += `<div class="small muted" style="margin-top:6px">+ ${rest} nhiệm vụ ${waiting === rest ? "đang chờ" : `khác${waiting ? ` (${waiting} đang chờ)` : ""}`}</div>`;
      }
      h += `</div>`;
    }
  }
  h += `<form class="composer" id="composer"><input id="msg" placeholder="Nhập yêu cầu tiếp theo..." autocomplete="off"><button id="send" aria-label="Gửi"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form>`;
  return h;
}

function workflowView(){
  if (!S.tasks.length) return `<div class="ctitle"><h2>Workflow</h2></div><div class="empty">Chưa có kế hoạch.</div>`;
  // layer tasks by dependency depth (Task DAG)
  const by = Object.fromEntries(S.tasks.map(t => [t.task_id, t]));
  const depth = {};
  const d = id => depth[id] ?? (depth[id] = Math.max(0, ...(by[id]?.depends_on || []).filter(x=>by[x]).map(x => d(x)+1)));
  S.tasks.forEach(t => d(t.task_id));
  const layers = [];
  S.tasks.forEach(t => (layers[depth[t.task_id]] ||= []).push(t));
  let h = `<div class="ctitle"><h2>Workflow</h2><span class="small muted">Task DAG theo tầng phụ thuộc</span></div><div class="dag">`;
  layers.forEach((L,i) => {
    h += `<div><div class="lbl">Tầng ${i+1}</div><div class="col">` +
      L.map(t => `<div class="node" title="${esc(t.task_id)}">${stateIcon(t.state)}${esc(t.title)}</div>`).join("") + `</div></div>`;
  });
  h += `</div><table style="margin-top:8px"><tr><th>Nhiệm vụ</th><th>Trạng thái</th><th>Worker</th><th>Lần</th></tr>` +
    S.tasks.map(t => `<tr><td>${esc(t.title)}<div class="small muted"><code>${esc(t.task_id)}</code></div></td><td>${badgeFor(t.state)}</td><td>${esc(t.worker||"—")}</td><td>${t.attempt+1}</td></tr>`).join("") + `</table>`;
  return h;
}

function workersView(){
  let h = `<div class="ctitle"><h2>AI Workers</h2><span class="small muted">${S.nodes.length} node · ${S.workers.length} worker</span></div><div class="lanes">`;

      <table style="margin-top:8px"><tr><th>Worker</th><th>Model</th><th>Lane</th><th>Capabilities</th></tr>` +
      (ws.map(w => `<tr><td>${esc(w.label)}<div class="small muted"><code>${esc(w.worker_id)}</code></div></td><td>${esc(w.model||"tool")}</td><td>${esc(w.lane)}</td><td class="small">${esc(w.capabilities.join(", "))}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">Không có worker</td></tr>`) +

function modelsView(){

function artifactsView(){

/* ------------------------------------------------------------------ Direct Mode (ADR-121) */
let DIR = null, dsel = null, dtask = null, dtimer = null;
try { dsel = localStorage.getItem("shams.dpreset"); } catch (e) {}
const KIND_LBL = {chat:"Văn bản / code", image:"Ảnh", scene3d:"Cảnh 3D", image_to_3d:"Ảnh → 3D"};
async function loadDirect(){
  try { DIR = await api("/api/direct/presets"); DIR.tasks = (await api("/api/direct/tasks")).tasks; }
  catch (e) { alert(e.message); return; }
  if (!DIR.presets.find(p => p.id === dsel)) dsel = (DIR.presets.find(p => p.status === "ok") || DIR.presets[0] || {}).id;
  render(true);
}
function dField(k, sch, v){
  const lbl = `${esc(k)}${sch.description ? ` <span class="muted">· ${esc(sch.description)}</span>` : ""}`;
  if (sch.type === "boolean") return `<label>${lbl}<select class="f" data-k="${esc(k)}" data-t="boolean"><option value="">mặc định</option><option value="true" ${v===true?"selected":""}>bật</option><option value="false" ${v===false?"selected":""}>tắt</option></select></label>`;
  if (sch.enum) return `<label>${lbl}<select class="f" data-k="${esc(k)}" data-t="string"><option value=""></option>${sch.enum.map(o => `<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  const num = sch.type === "number" || sch.type === "integer";
  if (k === "system" || k === "negative") return `<label style="grid-column:1/-1">${lbl}<textarea class="f" style="min-height:52px" data-k="${esc(k)}" data-t="string">${esc(v ?? "")}</textarea></label>`;
  return `<label>${lbl}<input class="f" data-k="${esc(k)}" data-t="${num ? sch.type : "string"}" ${num ? `type="number" step="${sch.type==="integer"?1:"any"}"` : ""} ${sch.minimum!=null?`min="${sch.minimum}"`:""} ${sch.maximum!=null?`max="${sch.maximum}"`:""} value="${esc(v ?? "")}"></label>`;
}
function dOutputs(t){
  if (!t) return "";
  const head = `<div class="small" style="margin-bottom:6px"><code>${esc(t.task_id)}</code> · ${esc(t.preset)} · ${badgeFor(t.state)} ${t.running ? '<span class="badge b-chip">đang chạy…</span>' : ""}</div>`;
  let h = head;
  if (t.error) h += `<div class="small" style="color:var(--bad);margin-bottom:6px">${esc(t.error)}</div>`;
  for (const o of t.outputs || []){
    if (o.media_type.startsWith("image/")) h += `<a href="${o.url}" target="_blank"><img src="${o.url}" style="max-width:100%;max-height:520px;border-radius:8px;border:1px solid var(--border)" alt="${esc(o.logical_id)}"></a>`;
    else if (o.media_type.startsWith("text/") || o.media_type === "application/json") h += `<pre class="console" style="max-height:480px;white-space:pre-wrap" data-src="${o.url}">…</pre>`;
    else h += `<div><a href="${o.url}" download="${esc(o.logical_id)}">Tải ${esc(o.logical_id)} (${esc(o.media_type)})</a></div>`;
  }
  if (t.usage) h += `<div class="small muted" style="margin-top:6px">${t.usage.tokens_in ?? 0} token vào · ${t.usage.tokens_out ?? 0} token ra · ${t.usage.wall_seconds ?? "?"} s</div>`;
  if (t.events) h += `<details style="margin-top:6px"><summary class="small muted">Tiến trình (${t.events.length} sự kiện)</summary><div class="console" style="max-height:220px">${t.events.map(e => `[${esc((e.at||"").slice(11,19))}] ${esc(e.type)} ${esc(e.subject)}`).join("<br>")}</div></details>`;
  return h;
}
async function dFill(){
  for (const el of document.querySelectorAll("[data-src]")){
    try { const r = await fetch(el.dataset.src); el.textContent = await r.text(); } catch (e) { el.textContent = "(không đọc được)"; }
  }
}
async function dWatch(tid){
  clearTimeout(dtimer);
  try { dtask = await api(`/api/direct/tasks/${encodeURIComponent(tid)}`); } catch (e) { return; }
  const box = $("d_result");
  if (!box) return;
  box.innerHTML = dOutputs(dtask); dFill();
  const final = ["ACCEPTED","FAILED","BLOCKED","HUMAN_REVIEW","CANCELED"].includes(dtask.state) && !dtask.running;
  if (!final) dtimer = setTimeout(() => dWatch(tid), 1000);
  else { DIR.tasks = (await api("/api/direct/tasks")).tasks; const l = $("d_hist"); if (l) l.innerHTML = dHist(); dBindHist(); $("d_run").disabled = false; }
}
function dHist(){
  return (DIR.tasks || []).map(t => `<button class="btn sm" data-tid="${esc(t.task_id)}" style="margin:0 6px 6px 0">${esc(t.task_id.slice(12))} · ${esc(t.preset)} · ${esc(t.state)}</button>`).join("") || '<span class="small muted">Chưa có.</span>';
}
function dBindHist(){ document.querySelectorAll("[data-tid]").forEach(b => b.onclick = () => dWatch(b.dataset.tid)); }
function renderDirect(){
  const c = $("center");
  if (!DIR) { c.innerHTML = '<div class="empty">Đang tải…</div>'; return; }
  const p = DIR.presets.find(x => x.id === dsel);
  let h = `<div class="ctitle"><h2>Direct Mode</h2><span class="small muted">Chọn model/preset, nhập prompt, chạy ngay — không Planner, không DAG</span></div>`;
  const groups = {};
  for (const x of DIR.presets) (groups[x.kind] = groups[x.kind] || []).push(x);
  h += `<div class="formgrid" style="grid-template-columns:1fr"><label>Model / preset<select class="f" id="d_preset">${Object.entries(groups).map(([k, xs]) => `<optgroup label="${esc(KIND_LBL[k] || k)}">${xs.map(x => `<option value="${esc(x.id)}" ${x.id===dsel?"selected":""}>${esc(x.label)}${x.content_policy.adult?" (18+)":""} — ${esc(x.model || x.wanted || "")}${x.status!=="ok"?` · ${esc(x.status)}`:""}</option>`).join("")}</optgroup>`).join("")}</select></label></div>`;
  if (!p) { c.innerHTML = h + '<div class="empty">Chưa có preset nào. Thêm models.roles hoặc models.presets trong settings.</div>'; return; }
  h += `<div class="small muted" style="margin:6px 0 10px">${esc(p.provider)} · <code>${esc(p.model || p.wanted || "")}</code> · ${p.resources.vram_mb ? `~${gb(p.resources.vram_mb)} VRAM · ` : ""}lane ${esc(p.resources.lane)} · chế độ: ${esc(p.execution_modes.join(", "))}${p.autonomous_default?" · dùng trong Autonomous":""}${p.status!=="ok"?` · <b style="color:var(--bad)">${esc(p.status)}</b> ${esc(p.how)}`:""}</div>`;
  const props = (p.input_schema || {}).properties || {};
  h += `<label class="small muted">Prompt<textarea class="f" id="d_prompt" style="min-height:110px;font-family:inherit;font-size:13px" placeholder="Nhập yêu cầu…"></textarea></label>`;
  const keys = Object.keys(props).filter(k => k !== "prompt");
  if (keys.length) h += `<details style="margin-top:8px" open><summary class="small muted">Tham số</summary><div class="formgrid" style="margin-top:6px">${keys.map(k => dField(k, props[k], p.params[k])).join("")}</div></details>`;
  if (p.content_policy.adult){
    h += DIR.allow_adult_content
      ? `<div class="blk" style="margin-top:10px;border:1px solid var(--warn);border-radius:8px;padding:8px"><b>Preset chỉ dành cho người lớn.</b> Không bao giờ được dùng tự động. Prompt về trẻ vị thành niên, không đồng thuận, lạm dụng hoặc người thật có thể nhận diện sẽ bị từ chối.<label style="display:flex;gap:8px;margin-top:6px"><input type="checkbox" id="d_adult"><span class="small">${esc(DIR.confirm_text)}</span></label></div>`
      : `<div class="small" style="margin-top:10px;color:var(--bad)">Preset 18+ đang tắt. Bật bằng <code>general.allow_adult_content: true</code> trong settings nếu bạn muốn dùng.</div>`;
  }
  h += `<div class="actions" style="margin-top:10px"><button class="btn primary" id="d_run" ${p.status!=="ok"?"disabled":""}>Chạy</button><span class="small muted" id="d_msg"></span></div>`;
  h += `<div id="d_result" style="margin-top:12px">${dOutputs(dtask)}</div>`;
  h += `<div class="lbl" style="margin-top:14px">Lần chạy gần đây</div><div id="d_hist">${dHist()}</div>`;
  c.innerHTML = h; dFill(); dBindHist();
  $("d_preset").onchange = e => { dsel = e.target.value; try{localStorage.setItem("shams.dpreset", dsel)}catch(_){}; renderDirect(); };
  $("d_run").onclick = async () => {
    const params = {prompt: $("d_prompt").value.trim()};
    if (!params.prompt) { $("d_msg").textContent = "Nhập prompt trước."; return; }
    for (const el of c.querySelectorAll("[data-k]")){
      const v = el.value.trim(); if (v === "") continue;
      params[el.dataset.k] = el.dataset.t === "boolean" ? v === "true" : el.dataset.t === "integer" ? parseInt(v, 10) : el.dataset.t === "number" ? parseFloat(v) : v;
    }
    const adult = $("d_adult");
    if (p.content_policy.adult && !(adult && adult.checked)) { $("d_msg").textContent = "Cần xác nhận điều khoản 18+ ở trên."; return; }
    $("d_run").disabled = true; $("d_msg").textContent = "";
    try { const t = await api("/api/direct/run", {preset: p.id, params, confirm_adult: !!(adult && adult.checked)}); dWatch(t.task_id); }
    catch (e) { $("d_msg").textContent = e.message; $("d_run").disabled = false; }
  };
}

  } else {

    $("gpuname").textContent = "SHAMS vẫn chạy được; gắn model qua API hoặc máy khác.";
  }
  const ram = hw.ram || {};
  $("ram").textContent = ram.total_mb ? (ram.available_mb != null ? `${gb(ram.total_mb - ram.available_mb)} / ${gb(ram.total_mb)}` : gb(ram.total_mb)) : "—";

     `<button data-d="retry" data-t="${esc(t.task_id)}">Thử lại</button><button data-d="accept" data-t="${esc(t.task_id)}">Chấp nhận</button><button data-d="fail" data-t="${esc(t.task_id)}">Dừng</button>`}</div></div>`).join("");
  $("reviewlist").querySelectorAll("button").forEach(b => b.onclick = () => decide(b.dataset.t, b.dataset.d));

  const draft = $("msg") ? $("msg").value : "";
  center.innerHTML = ({chat:chatView, workflow:workflowView, workers:workersView, models:modelsView, artifacts:artifactsView, qa:qaView}[view] || chatView)();
  if (view === "chat" || !VIEWS.find(x => x[0]===view)){
    const input = $("msg"); input.value = draft;
    if (focused) input.focus();
    $("send").disabled = sending;
    $("composer").onsubmit = e => { e.preventDefault(); send(input.value); };
    center.querySelectorAll(".eng").forEach(b => b.onclick = () => b.dataset.domain ? configure(b.dataset.domain, {}) : configure(S.project.domain, {[b.dataset.opt]: b.dataset.val}));
  }
}

async function api(path, body, method){
  const opt = body !== undefined ? {method: method || "POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);
  return r.json();
}
async function poll(){
  try { S = await api("/api/state"); $("offline").hidden = true; render(false); }
  catch (e) { $("offline").hidden = false; $("conn").textContent = "Disconnected"; $("conn").className = "badge b-bad"; }
}
async function configure(domain, options){
  try { S = await api("/api/configure", {domain, options}); } catch (e) { alert(e.message); }
  render(true);
}
async function send(text){
  if (!text.trim() || sending) return;
  sending = true;
  try { S = await api("/api/chat", {text}); $("msg").value = ""; } catch (e) { alert(e.message); }
  sending = false; render(true);
}
async function decide(task_id, decision){
  try { S = await api("/api/decide", {task_id, decision}); } catch (e) { alert(e.message); }
  render(true);
}
async function openProject(id){
  try { S = await api("/api/projects/open", {id}); view = "chat"; } catch (e) { alert(e.message); }
  render(true);
}
async function newProject(){
  const name = prompt("Tên dự án mới (có thể để trống, SHAMS lấy từ câu yêu cầu đầu tiên):", "");
  if (name === null) return;
  try { S = name.trim() ? await api("/api/projects", {name}) : await api("/api/projects/close", {}); view = "chat"; }
  catch (e) { alert(e.message); }
  render(true);
}

    $("c_add").onclick = () => { const n = $("c_name").value.trim(); if (!n) return alert("Nhập tên kết nối");
      const c = {provider: prov.value}; if ($("c_url").value.trim()) c.base_url = $("c_url").value.trim(); if ($("c_env").value.trim()) c.api_key_env = $("c_env").value.trim();
      patch(d => { d.connections = {...(d.connections||{}), [n]: c}; }, `Đã thêm kết nối ${n}.`); };
    document.querySelectorAll("[data-test]").forEach(b => b.onclick = async () => { b.textContent = "…";
      try { testResults[b.dataset.test] = await api("/api/connections/test", {name: b.dataset.test}); } catch (e) { testResults[b.dataset.test] = {ok:false, error:e.message, models:[]}; }
      renderSettings(); });
    document.querySelectorAll("[data-delconn]").forEach(b => b.onclick = () => patch(d => { delete (d.connections||{})[b.dataset.delconn]; }, "Đã xóa (chỉ xóa được trong phạm vi đang chọn)."));
    document.querySelectorAll("[data-delw]").forEach(b => b.onclick = () => patch(d => { d.workers = (d.workers||[]).filter(w => w.id !== b.dataset.delw); }, "Đã xóa worker (trong phạm vi đang chọn)."));
    document.querySelectorAll("[data-wen]").forEach(b => b.onchange = () => patch(d => { d.workers = d.workers || []; let w = d.workers.find(x => x.id === b.dataset.wen); if (!w) d.workers.push(w = {id: b.dataset.wen}); w.enabled = b.checked; }));
    $("w_add").onclick = () => { const id = $("w_id").value.trim(), conn = $("w_conn").value, caps = $("w_caps").value.split(",").map(s => s.trim()).filter(Boolean);
      if (!id || !conn || !caps.length) return alert("Cần ID, kết nối và ít nhất một capability");
      const w = {id, connection: conn, model: $("w_model").value.trim(), node: $("w_node").value, lane: $("w_lane").value, capabilities: caps};
      if (+$("w_vram").value) w.vram_mb = +$("w_vram").value;
      const mcp = [...document.querySelectorAll(".w_mcp:checked")].map(x => x.value); if (mcp.length) w.mcp = mcp;
      patch(d => { d.workers = [...(d.workers||[]).filter(x => x.id !== id), w]; }, `Đã thêm worker ${id}.`); };
  },
  async mcp(){
    document.querySelectorAll("[data-delm]").forEach(b => b.onclick = () => patch(d => { delete (d.mcp_servers||{})[b.dataset.delm]; mcpRows = null; }, "Đã xóa (trong phạm vi đang chọn)."));
    document.querySelectorAll("[data-men]").forEach(b => b.onchange = () => patch(d => { d.mcp_servers = d.mcp_servers || {}; d.mcp_servers[b.dataset.men] = {...(d.mcp_servers[b.dataset.men] || SET.merged.mcp_servers[b.dataset.men]), enabled: b.checked}; mcpRows = null; }));
    document.querySelectorAll("[data-allow]").forEach(b => b.onclick = () => patch(d => { d.permissions = d.permissions || {}; d.permissions.allow = [...new Set([...(d.permissions.allow||[]), b.dataset.allow])]; mcpRows = null; }, `Đã cho phép ${b.dataset.allow}.`));
    $("m_add").onclick = () => { const n = $("m_name").value.trim(), t = $("m_type").value; if (!n) return alert("Nhập tên");
      const s = {type: t}; const kv = kvs("m_kv");
      if (t === "stdio"){ s.command = $("m_cmd").value.trim(); s.args = lines("m_args"); if (Object.keys(kv).length) s.env = kv; }
      else { s.url = $("m_url").value.trim(); if (Object.keys(kv).length) s.headers = kv; }
      mcpRows = null; patch(d => { d.mcp_servers = {...(d.mcp_servers||{}), [n]: s}; }, `Đã thêm MCP server ${n}.`); };
    if (mcpRows === null && Object.keys(SET.merged.mcp_servers || {}).length){
      mcpRows = undefined;
      try { mcpRows = await api("/api/mcp"); } catch (e) { mcpRows = []; }
      if (view === "settings" && stab === "mcp") renderSettings();
    }
  },
  hooks(){
    document.querySelectorAll("[data-delh]").forEach(b => b.onclick = () => patch(d => { const l = [].concat((d.hooks||{})[b.dataset.delh] || []); l.splice(+b.dataset.i, 1); if (l.length) d.hooks[b.dataset.delh] = l; else delete d.hooks[b.dataset.delh]; }, "Đã xóa hook (trong phạm vi đang chọn)."));
    $("h_add").onclick = () => { const p = $("h_pat").value.trim(), c = $("h_cmd").value.trim(); if (!p || !c) return alert("Cần sự kiện và lệnh");
      patch(d => { d.hooks = d.hooks || {}; d.hooks[p] = [...[].concat(d.hooks[p] || []), {command: c, timeout: +$("h_to").value || 60}]; }, "Đã thêm hook."); };
  },
  hardware(){
    document.querySelectorAll("[data-deln]").forEach(b => b.onclick = () => patch(d => { d.nodes = (d.nodes||[]).filter(n => n.id !== b.dataset.deln); }));
    $("hw_add").onclick = () => { const hw = S.hardware;
      const node = {id:"node.local", kind:"local", cpu_slots: Math.max(1, Math.min(4, Math.floor(hw.cpu.cores/4))), gpus: hw.gpus.map(g => ({index:g.index, vram_mb:g.vram_total_mb, name:g.name}))};
      patch(d => { d.nodes = [...(d.nodes||[]).filter(n => n.id !== "node.local"), node]; }, "Đã khai báo PC này là node.local."); };
  },
  env(){
    document.querySelectorAll("[data-secbtn]").forEach(b => b.onclick = async () => { const n = b.dataset.secbtn, v = document.querySelector(`[data-sec="${n}"]`).value;
      if (!v) return; try { await api("/api/secret", {name:n, value:v}); flash = {ok:true, text:`Đã đặt ${n} cho phiên này (không ghi xuống đĩa).`}; } catch (e) { flash = {ok:false, text:e.message}; }
      loadSettings(); });
    $("e_save").onclick = () => patch(d => { d.env = kvs("e_kv"); });
  },
  files(){ $("raw_save").onclick = () => { let data; try { data = JSON.parse($("raw").value || "{}"); } catch (e) { flash = {ok:false, text:"JSON không hợp lệ: " + e.message}; return renderSettings(); } saveScope(data); }; },
};

poll().then(() => { if (view === "settings") loadSettings(); else if (view === "direct") loadDirect(); });
setInterval(poll, 1000);
</script>
</body>
</html>
