[project]
name = "shams"
version = "2.0.0"
description = "SHAMS — Sequential Heterogeneous AI Manufacturing System (controller)"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint-sqlite==3.1.3",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
# Phase 1b: LLM worker thật. Pin khi gắn model đầu tiên (ADR-009).
agents = ["deepagents==0.7.32", "langchain-ollama"]

[project.scripts]
shams = "apps.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shams*", "shams_packs*", "apps*"]

[tool.setuptools.package-data]
"shams.contracts" = ["schemas/*.json"]
"shams_packs.game" = ["templates/*.json", "*.toml"]
"shams_packs.software" = ["templates/*.json"]
"shams.examples" = ["*.toml", "*.json"]
"apps.ui" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
