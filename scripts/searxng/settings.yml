# SearXNG for SHAMS research tools: local only, JSON output on, Google as the engine SHAMS asks for.
# The install step replaces CHANGE_ME_AT_INSTALL with a random secret (never commit a real one).
use_default_settings: true
general:
  instance_name: "SHAMS local search"
server:
  bind_address: "127.0.0.1"
  port: 8888
  secret_key: "CHANGE_ME_AT_INSTALL"
  limiter: false
  image_proxy: false
search:
  safe_search: 1
  formats:
    - html
    - json
